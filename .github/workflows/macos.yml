name: macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-tests-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Cache search models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Downloaded, checksum-pinned inputs only. The compiled models are
          # rebuilt from them on every run and never restored from a cache.
          path: |
            local/models/MobileCLIP
            !local/models/MobileCLIP/*.mlmodelc
          key: search-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-search-models.py') }}
      - name: Lint changed Swift files
        continue-on-error: true
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ ! "$BASE_REVISION" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_REVISION" == 0000000000000000000000000000000000000000 ]]; then
            echo "No comparison revision for this event; skipping changed-file lint."
            exit 0
          fi
          git cat-file -e "$BASE_REVISION^{commit}"
          status=0
          git diff --name-only --diff-filter=AM -z "$BASE_REVISION"...HEAD -- '*.swift' > "$RUNNER_TEMP/changed-swift-files"
          while IFS= read -r -d '' file; do
            swift format lint --strict --configuration .swift-format "$file" || status=1
          done < "$RUNNER_TEMP/changed-swift-files"
          exit "$status"
      - name: Validate release version
        run: |
          python3 scripts/test-release-version.py
          python3 scripts/check-release-version.py
      - name: Test bundle and model checks
        run: python3 scripts/test-bundle-checks.py
      - name: Prepare pinned offline search models
        run: python3 scripts/prepare-search-models.py
      - name: Native XCTest suite
        run: swift test
        env:
          SHELF_BEHAVIOR_REPORT: validation/macos/shelves.json
          SHELF_KEYBOARD_REPORT: validation/macos/keyboard.json
      - name: Validate localization
        run: swift scripts/check-strings.swift
      - name: Build Shelf with offline visual search
        run: bash scripts/build-community.sh release
        env:
          SHELF_BUNDLE_MODELS: 1
      - name: Verify bundle, signature and actual isolated launch
        run: |
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/Shelf.app/Contents/Info.plist | /usr/bin/grep -Fx com.baypeanut.Shelf
          codesign --verify --deep --strict build/Shelf.app
          python3 scripts/check-release-version.py --app build/Shelf.app
          python3 scripts/verify-bundle.py build/Shelf.app
      - name: Preserve synthetic behavior observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shelf-macos-behavior-${{ github.sha }}
          path: validation/macos/
          if-no-files-found: warn
          retention-days: 14
      # A pull request's build is checked but never published as an app.
      - name: Archive verified app
        if: github.event_name != 'pull_request'
        run: ditto -c -k --keepParent build/Shelf.app Shelf.zip
      - name: Preserve app
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Shelf-${{ github.sha }}
          path: Shelf.zip
          retention-days: 7
      - name: Report coverage
        continue-on-error: true
        run: |
          swift test --enable-code-coverage
          PROFILE=$(find .build -path '*/debug/codecov/default.profdata' -print -quit)
          BINARY=$(find .build -type f -path '*/debug/ShelfPackageTests.xctest/Contents/MacOS/ShelfPackageTests' -print -quit)
          xcrun llvm-cov report "$BINARY" -instr-profile="$PROFILE"
  release-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test release configuration
        run: swift test -c release
  thread-sanitizer:
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check thread safety
        run: swift test --sanitize=thread 2>&1 | tee thread-sanitizer.log
      - name: Preserve sanitizer log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thread-sanitizer-${{ github.sha }}
          path: thread-sanitizer.log
          retention-days: 7
