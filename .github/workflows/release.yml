name: Publish Shelf
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: shelf-stable-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a stable version from main
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          gh api --paginate --slurp repos/baypeanut/shelf/releases > "$RUNNER_TEMP/releases.json"
          python3 scripts/release-version.py "$RELEASE_TAG" "$RUNNER_TEMP/releases.json" >> "$GITHUB_OUTPUT"
  security:
    needs: preflight
    uses: ./.github/workflows/security.yml
  checks:
    needs: preflight
    uses: ./.github/workflows/macos.yml
  publish:
    needs: [preflight, security, checks]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      SHELF_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cache pinned search inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            local/models/MobileCLIP
            !local/models/MobileCLIP/*.mlmodelc
          key: search-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-search-models.py') }}
      - name: Prepare the update signing key
        env:
          UPDATE_KEY: ${{ secrets.SHELF_UPDATE_PRIVATE_KEY }}
        run: |
          test -n "$UPDATE_KEY" || { echo 'Missing SHELF_UPDATE_PRIVATE_KEY repository secret'; exit 1; }
          umask 077
          printf '%s' "$UPDATE_KEY" > "$RUNNER_TEMP/shelf-signing.key"
          echo "SHELF_UPDATE_KEY_FILE=$RUNNER_TEMP/shelf-signing.key" >> "$GITHUB_ENV"
      - name: Build and verify the signed community package
        run: bash scripts/prepare-release.sh
      - name: Publish only after every asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-notes.py "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$SHELF_RELEASE_TAG" --verify-tag --draft --title "Shelf $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$SHELF_RELEASE_TAG" "build/upload-$RELEASE_VERSION/"*
          gh release edit "$SHELF_RELEASE_TAG" --draft=false --latest
      - name: Remove the temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/shelf-signing.key"
