title = "Shelf source publication checks"
[extend]
useDefault = true

[[allowlists]]
description = "Ignored build caches; audit-public.py separately forbids tracking these paths"
paths = ['''^(\.git|\.build|build|dist|node_modules|local|test-results|playwright-report)/''']

# Exact pinned dependency revision. It cannot authenticate a client. No
# credential-shaped wildcard or whole test/source directory is excluded.
[[allowlists]]
description = "Pinned public Apple tokenizer commit"
regexTarget = "secret"
regexes = ['''^48faa0fea4b08d74188b3841771aca6ff2c92852$''']

# Kept for public history only: a since-removed test declared a variable of
# this type, without any key value.
[[allowlists]]
description = "Swift key type declaration without a value"
regexTarget = "secret"
regexes = ['''^Curve25519\.Signing\.PrivateKey$''']
